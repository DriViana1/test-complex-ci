runs-on: ubuntu-latest

before_install:
  - docker build -t adri-viana/react-test -f ./client/Dockerfile.dev ./client
  - docker build myproject

script:
  - docker run adri-viana/react-test npm test -- --coverage

after_success:
  - docker build -t adri-viana/multi-client ./client
  - docker build -t adri-viana/multi-nginx ./nginx
  - docker build -t adri-viana/multi-server ./server
  - docker build -t adri-viana/multi-worker ./worker
