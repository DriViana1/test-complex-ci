# Antes de executar este workflow, crie um bucket S3 e 
# atualize o nome do bucket no arquivo terraform/main.tf

name: CI/CD

on:
  push:
    branches:
      - main
      - feature/github-actions-ci

jobs:
  ci:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
              
      - name: Set image tag
        id: image_tag
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Update Dockerrun image tags
        run: |
          sed -i "s/:v2/:${IMAGE_TAG}/g" Dockerrun.aws.json

      - name: Docker version
        run: docker --version     

      - name: Build client test image
        run: docker build -t react-test -f ./client/Dockerfile.dev ./client

      - name: Run client tests
        run: docker run react-test npm test -- --coverage --watchAll=false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build client image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-client:${IMAGE_TAG} ./client

      - name: Build nginx image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx:${IMAGE_TAG} ./nginx

      - name: Build server
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-server:${IMAGE_TAG} -f ./server/Dockerfile.dev ./server

      - name: Build worker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker:${IMAGE_TAG} -f ./worker/Dockerfile.dev ./worker
      
      - name: Push client
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-client:${IMAGE_TAG}  

      - name: Push nginx
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx:${IMAGE_TAG}

      - name: Push server
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-server:${IMAGE_TAG}

      - name: Push worker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker:${IMAGE_TAG}


  cd:
    needs: ci
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}

    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::330905068651:role/git-role-aws
          aws-region: us-east-1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Get Beanstalk bucket
        id: bucket
        working-directory: terraform
        run: |
          echo "bucket=$(terraform output -raw beanstalk_bucket_name)" >> "$GITHUB_OUTPUT"
          
      - name: Update Dockerrun image tags
        run: |
          sed -i "s/:v2/:${IMAGE_TAG}/g" Dockerrun.aws.json


      - name: Upload Dockerrun to S3
        run: |
          aws s3 cp Dockerrun.aws.json \
            s3://${{ steps.bucket.outputs.bucket }}/Dockerrun-${IMAGE_TAG}.aws.json

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name complex \
            --version-label "complex-${IMAGE_TAG}" \
            --source-bundle S3Bucket="${{ steps.bucket.outputs.bucket }}",S3Key="Dockerrun-${IMAGE_TAG}.aws.json" \
            --process

      - name: Check application version
        run: |
          aws elasticbeanstalk describe-application-versions \
            --application-name complex \
            --version-label "complex-${IMAGE_TAG}"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name complex-env \
            --version-label "complex-${IMAGE_TAG}"

          aws elasticbeanstalk wait environment-updated \
            --environment-name complex-env

      - name: Check Elastic Beanstalk health
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name complex \
            --environment-names complex-env \
            --query 'Environments[0].[Status,Health,HealthStatus,VersionLabel]' \
            --output table
      #Test check if the application is running3