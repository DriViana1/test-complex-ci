name: CI

on:
  push:
    branches:
      - main
      - feature/github-actions-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: docker --version
      
      - name: Build client test image
        run: docker build -t react-test -f ./client/Dockerfile.dev ./client

      - name: Run client tests
        run: docker run react-test npm test -- --coverage --watchAll=false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build client image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-client ./client

      - name: Build nginx image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx ./nginx

      - name: Build server
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-server -f ./server/Dockerfile.dev ./server

      - name: Build worker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker -f ./worker/Dockerfile.dev ./worker
      
      
      - name: Push client
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-client

      - name: Push nginx
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-nginx

      - name: Push server
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-server

      - name: Push worker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/multi-worker